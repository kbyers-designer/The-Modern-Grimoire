<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Modern Grimoire</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{background:#121319;color:#e3e1ea;font-family:'Manrope',sans-serif;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;vertical-align:middle}
.filled{font-variation-settings:'FILL' 1,'wght' 300,'GRAD' 0,'opsz' 24}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#121319}
::-webkit-scrollbar-thumb{background:#46464c;border-radius:2px}
img{display:block;max-width:100%}
button{font-family:'Manrope',sans-serif}
input{font-family:'Manrope',sans-serif}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-up{animation:fadeUp .5s ease-out both}
.fade-in{animation:fadeIn .35s ease-out both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}.d5{animation-delay:.4s}

/* Page container */
.page{display:none}
.page.active{display:block}

/* Header */
#header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:linear-gradient(to bottom,#1a1b22,transparent)}
#header h1{font-family:‘Noto Serif’,serif;font-size:20px;letter-spacing:-0.02em;color:#e3e1ea}
#header .logo-icon{color:#e9c176;font-size:26px;margin-right:10px;font-variation-settings:‘FILL’ 1,‘wght’ 300,‘GRAD’ 0,‘opsz’ 24}
#header button{background:none;border:none;padding:8px;cursor:pointer;border-radius:4px;color:rgba(227,225,234,0.6);transition:background .3s}
#header button:hover{background:#34343b}

/* Bottom Nav */
#bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:50;height:72px;display:flex;justify-content:space-around;align-items:center;background:rgba(18,19,25,0.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(70,70,76,0.15);box-shadow:0 -8px 32px rgba(0,0,0,0.4)}
.nav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(227,225,234,0.5);transition:all .3s;padding:8px 12px}
.nav-btn.active{color:#e9c176;transform:scale(1.05);filter:drop-shadow(0 0 8px rgba(233,193,118,0.3))}
.nav-btn span.lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.05em}

/* Typography helpers */
.serif{font-family:‘Noto Serif’,serif}
.label{font-family:‘Manrope’,sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:0.15em}

/* Atmospheric background */
#atmosphere{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
#atmosphere .orb1{position:absolute;top:25%;left:-80px;width:300px;height:300px;background:rgba(233,193,118,0.04);border-radius:50%;filter:blur(120px)}
#atmosphere .orb2{position:absolute;bottom:25%;right:-80px;width:260px;height:260px;background:rgba(196,197,219,0.04);border-radius:50%;filter:blur(100px)}

/* Reusable card styles */
.surface-low{background:#1a1b22}
.surface-container{background:#1e1f26}
.surface-high{background:#292a30}
.surface-highest{background:#34343b}
.surface-lowest{background:#0d0e14}

/* Timer ring */
.timer-ring{stroke-dasharray:283;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}

/* Collection card hover */
.collection-card{transition:transform .3s}
.collection-card:active{transform:scale(0.98)}

/* Step accordion */
.step-body{max-height:0;overflow:hidden;transition:max-height .4s ease,opacity .3s ease;opacity:0}
.step-body.open{max-height:600px;opacity:1}
.step-num{transition:color .3s}
.step-chevron{transition:transform .3s}
.step-chevron.open{transform:rotate(180deg)}

/* Recent item hover */
.recent-item{transition:background .3s;border-radius:4px}
.recent-item:active{background:#292a30}

/* Filter tab */
.filter-tab{background:none;border:none;cursor:pointer;padding-bottom:14px;font-family:‘Manrope’,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:0.1em;transition:all .3s;white-space:nowrap;border-bottom:2px solid transparent;color:rgba(227,225,234,0.5)}
.filter-tab.active{color:#e9c176;border-bottom-color:#e9c176}

/* Checkbox */
.checkbox{width:20px;height:20px;border-radius:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;cursor:pointer}
.checkbox.off{border:1px solid #46464c;background:#0d0e14}
.checkbox.on{border:1px solid #e9c176;background:rgba(233,193,118,0.1)}
</style>

</head>

<div id="atmosphere"><div class="orb1"></div><div class="orb2"></div></div>

// ─── State ───
let currentPage = 'library';
let openStep = 0;
let timerSeconds = 671;
let timerRunning = false;
let timerInterval = null;
let checkedItems = {1:true};
let corrFilter = 'all';
let corrSearch = '';

const app = document.getElementById('app');

// ─── Navigation ───
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    navigateTo(btn.dataset.page);
  });
});

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.nav-btn[data-page="${page}"]`).classList.add('active');
  window.scrollTo(0, 0);
  render();
}

// ─── Timer ───
function startTimer() {
  timerRunning = !timerRunning;
  if (timerRunning) {
    timerInterval = setInterval(() => {
      timerSeconds--;
      if (timerSeconds <= 0) { timerRunning = false; clearInterval(timerInterval); }
      updateTimerDisplay();
    }, 1000);
  } else {
    clearInterval(timerInterval);
  }
  updateTimerDisplay();
}

function resetTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  timerSeconds = 671;
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const el = document.getElementById('timer-time');
  const ring = document.getElementById('timer-ring-progress');
  const btn = document.getElementById('timer-btn');
  if (!el) return;
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  const progress = ((671 - timerSeconds) / 671) * 283;
  ring.style.strokeDashoffset = 283 - progress;
  btn.textContent = timerRunning ? 'Pause' : 'Begin';
  btn.style.boxShadow = timerRunning ? '0 0 25px rgba(233,193,118,0.35)' : '0 0 15px rgba(233,193,118,0.2)';
}

// ─── Render ───
function render() {
  clearInterval(timerInterval);
  timerRunning = false;
  switch(currentPage) {
    case 'library': app.innerHTML = renderLibrary(); break;
    case 'rituals': app.innerHTML = renderRituals(); bindSteps(); break;
    case 'correspondence': app.innerHTML = renderCorrespondence(); bindCorrespondence(); break;
    case 'guides': app.innerHTML = renderGuides(); bindGuides(); break;
  }
}

function bindSteps() {
  document.querySelectorAll('.step-card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.step);
      openStep = openStep === idx ? -1 : idx;
      // Re-render just the steps state
      document.querySelectorAll('.step-card').forEach((c, i) => {
        const body = c.querySelector('.step-body');
        const num = c.querySelector('.step-num');
        const chev = c.querySelector('.step-chevron');
        if (i === openStep) {
          c.style.background = '#292a30';
          body.classList.add('open');
          body.style.marginTop = '16px';
          num.style.color = '#e9c176';
          chev.classList.add('open');
        } else {
          c.style.background = '#1e1f26';
          body.classList.remove('open');
          body.style.marginTop = '0';
          num.style.color = '#46464c';
          chev.classList.remove('open');
        }
      });
    });
  });
}
